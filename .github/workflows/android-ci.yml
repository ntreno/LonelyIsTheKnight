name: Android CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --- Checkout source ---
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Setup JDK ---
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # --- Enable Gradle cache ---
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # --- Make Gradle wrapper executable ---
      - name: Grant execute permission
        run: chmod +x gradlew

      # --- Run all CI checks in ONE Gradle task ---
      - name: Run CI checks
        run: ./gradlew ciChecks --stacktrace

      # --- Assemble APK for verification only ---
      - name: Build Debug APK
        run: ./gradlew assembleDebug
